[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
]

# The mount needs an absolute path: with Podman on macOS, "." resolves inside the VM.
[[repos]]
repo = "local"
hooks = [
  {
    id = "nixfmt",
    name = "nixfmt",
    entry = "sh -c 'podman run --rm -v \"$PWD\":/src:z -w /src acelpb-nix-tools nixfmt \"$@\"' --",
    language = "system",
    files = "\\.nix$",
  },
  {
    id = "statix",
    name = "statix",
    entry = "sh -c 'podman run --rm -v \"$PWD\":/src:z -w /src acelpb-nix-tools statix check'",
    language = "system",
    files = "\\.nix$",
    pass_filenames = false,
  },
  {
    id = "deadnix",
    name = "deadnix",
    entry = "sh -c 'podman run --rm -v \"$PWD\":/src:z -w /src acelpb-nix-tools deadnix --fail \"$@\"' --",
    language = "system",
    files = "\\.nix$",
  },
]
